[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "genai"
version = "0.1.0"
description = "OpenAI- and Anthropic-compatible proxy for ShanghaiTech GenAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "flask-cors>=4.0.0",
    "jinja2>=3.1.6,<4",
    "pillow>=11.3.0,<13",
    "requests>=2.32.5",
    "shanghaitech-ids-passkey>=0.1.0",
    "tiktoken>=0.11.0,<0.13",
    "tokenizers>=0.22.2,<0.23",
    "urllib3>=2.5.0,<3",
]

[project.scripts]
genai2openai = "genai_proxy.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10",
]

[tool.uv.sources]
shanghaitech-ids-passkey = { git = "https://github.com/vvbbnn00/shanghaitech-ids-passkey.git", branch = "main" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "live: requires an explicit opt-in and access to the real upstream service",
]

[tool.hatch.build.targets.wheel]
packages = ["src/genai_proxy"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "main.py",
    "pyproject.toml",
    "src/genai_proxy",
]
